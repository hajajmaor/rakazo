name: Publish approved fork images
# Fork publishing is explicit: no tag, push or PR can publish or deploy automatically.
# Never updates edge/latest. Production deployment is a separate approval/action.
on:
  workflow_dispatch:
    inputs:
      approved:
        description: Owner approved building and publishing this exact candidate
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      approved:
        description: Explicit owner approval for this candidate
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-tests:
    name: Mandatory full test gate
    if: inputs.approved == true
    uses: ./.github/workflows/fork-full-validation.yml
    permissions:
      contents: read
  build:
    name: Build ${{ matrix.image }} ${{ matrix.arch }}
    needs: full-tests
    if: inputs.approved == true && needs.full-tests.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              image: app,
              arch: amd64,
              runner: ubuntu-latest,
              context: .,
              file: infra/compose/Dockerfile,
              desktop: "1",
            }
          - {
              image: app,
              arch: arm64,
              runner: ubuntu-24.04-arm,
              context: .,
              file: infra/compose/Dockerfile,
              desktop: "1",
            }
          - {
              image: updater,
              arch: amd64,
              runner: ubuntu-latest,
              context: .,
              file: infra/updater/Dockerfile,
              desktop: "1",
            }
          - {
              image: updater,
              arch: arm64,
              runner: ubuntu-24.04-arm,
              context: .,
              file: infra/updater/Dockerfile,
              desktop: "1",
            }
          - {
              image: computer,
              arch: amd64,
              runner: ubuntu-latest,
              context: infra/sandboxes/computer,
              file: infra/sandboxes/computer/Dockerfile,
              desktop: "1",
            }
          - {
              image: computer,
              arch: arm64,
              runner: ubuntu-24.04-arm,
              context: infra/sandboxes/computer,
              file: infra/sandboxes/computer/Dockerfile,
              desktop: "1",
            }
          - {
              image: computer-headless,
              arch: amd64,
              runner: ubuntu-latest,
              context: infra/sandboxes/computer,
              file: infra/sandboxes/computer/Dockerfile,
              desktop: "0",
            }
          - {
              image: computer-headless,
              arch: arm64,
              runner: ubuntu-24.04-arm,
              context: infra/sandboxes/computer,
              file: infra/sandboxes/computer/Dockerfile,
              desktop: "0",
            }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_SHA=${{ github.sha }}
            DESKTOP=${{ matrix.desktop }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=fork-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.image }}-${{ matrix.arch }}
      - name: Check app filesystem contains no credentials
        if: matrix.image == 'app'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/app@${{ steps.image.outputs.digest }}
          PLATFORM: linux/${{ matrix.arch }}
        run: bash infra/compose/check-image.sh "$IMAGE" "$PLATFORM"
      - name: Record exact digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]]
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish immutable ${{ matrix.image }} index
    needs: [full-tests, build]
    if: inputs.approved == true && needs.full-tests.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, updater, computer, computer-headless]
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true
      - name: Publish and record multiarch digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/digests/*)
          test "${#files[@]}" = 2
          refs=()
          for file in "${files[@]}"; do refs+=("$IMAGE@sha256:$(basename "$file")"); done
          docker buildx imagetools create -t "$IMAGE:sha-$SOURCE_SHA" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" | tee image-index.txt
          digest=$(awk '/^Digest:/ {print $2; exit}' image-index.txt)
          [[ "$digest" == sha256:* ]]
          echo "$IMAGE:sha-$SOURCE_SHA@$digest" | tee image-ref.txt
          cat image-ref.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-${{ matrix.image }}
          path: |
            image-ref.txt
            image-index.txt
          retention-days: 90

