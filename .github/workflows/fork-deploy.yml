name: fork-deploy

# Lives only on the fork's deploy branch, so main stays identical to upstream. Builds arm64 images
# only (the server's architecture), tagged sha-<commit> and deploy, which Dokploy pulls.
# Image names, Dockerfiles and contexts mirror upstream's publish-server-image.yml.
on:
  push:
    branches: [deploy]

permissions:
  contents: read

concurrency:
  group: fork-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - run: pnpm check

  unit:
    name: Unit tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Install age for the encrypted backup round trip
        run: |
          curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age age/age-keygen
          sudo install -m 755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/
      - run: pnpm run test --shard=${{ matrix.shard }}/6

  images:
    name: Build ${{ matrix.name }} arm64
    needs: [checks, unit]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: infra/compose/Dockerfile
            context: .
          - name: updater
            dockerfile: infra/updater/Dockerfile
            context: .
          - name: computer
            dockerfile: infra/sandboxes/computer/Dockerfile
            context: infra/sandboxes/computer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built and scanned before any tag points at it.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          outputs: |
            type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true${{ matrix.name == 'app' && ',oci-mediatypes=true,compression=zstd' || '' }}
            ${{ matrix.name == 'app' && 'type=tar,dest=/tmp/rootfs.tar' || '' }}
          build-args: ${{ matrix.name == 'app' && format('GIT_SHA={0}', github.sha) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-arm64
          provenance: mode=max
          sbom: true
      - name: Check the app image ships no credentials
        if: matrix.name == 'app'
        run: bash infra/compose/check-image.sh /tmp/rootfs.tar
      - name: Tag sha and deploy
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: docker buildx imagetools create -t "$IMAGE:sha-$SHA" -t "$IMAGE:deploy" "$IMAGE@$DIGEST"
