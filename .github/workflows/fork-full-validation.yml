name: Fork full validation
on:
  push:
    branches: ["review/**", deploy]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: fork-validation-${{ github.ref }}
  cancel-in-progress: false
env:
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
jobs:
  static:
    name: Lint, full typecheck and script safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - run: pnpm check
      - name: Repository safety tests
        run: |
          set -euo pipefail
          python3 infra/compose/host-safeguards.test.py
          python3 infra/preview/start.test.py
          python3 .github/scripts/codex-subscription-auth.test.py
          python3 .github/scripts/dependency-update-patch.test.py
          python3 .github/scripts/apply-issue-triage.test.py
          python3 .github/scripts/pr-screenshots.test.py
          python3 .github/scripts/changed-areas.test.py
          python3 .github/scripts/ota-base.test.py
          node --test .github/scripts/app-store-review.test.mjs
          node --test scripts/lazy-vendors.test.mjs
  unit:
    name: Unit tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Install checksum-verified age for backup tests
        run: |
          curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age age/age-keygen
          sudo install -m 755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/
      - run: pnpm run test --shard=${{ matrix.shard }}/6
  integration:
    name: Postgres journeys (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakazo
        ports: ["5432:5432"]
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/rakazo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:integration --shard=${{ matrix.shard }}/6
  build:
    name: Production application build and Electron smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      BETTER_AUTH_SECRET: ci-build-auth-secret-at-least-32-characters
      ENCRYPTION_KEY: ci-build-encryption-key-at-least-32-characters
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          turbo: build
      - run: pnpm db:generate
      - run: pnpm build
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - run: xvfb-run --auto-servernum pnpm --filter @rakazo/desktop exec playwright test --config e2e/playwright.config.ts
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-e2e-screenshots
          path: apps/desktop/e2e/screenshots
          if-no-files-found: ignore
  native:
    name: Native computer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - if: runner.os == 'Windows'
        run: node --test scripts/pnpm.test.mjs
      - run: node --test scripts/setup-worktree.test.mjs
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          filter: "@rakazo/desktop..."
      - run: pnpm db:generate
      - run: pnpm --filter @rakazo/desktop build
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - run: pnpm exec vitest run packages/adapters/src/host-computer.test.ts packages/adapters/src/file-handle-path.test.ts packages/adapters/src/desktop-sandbox-command.test.ts packages/adapters/src/desktop-sandbox-paths.test.ts packages/adapters/src/desktop-workspace-cleanup.test.ts packages/adapters/src/computer-support.test.ts apps/desktop/src/host-computer.test.ts
      - if: runner.os == 'Windows'
        run: pnpm exec vitest run apps/desktop/src/host-screen.windows.test.ts
      - run: pnpm --filter @rakazo/desktop exec electron ../../node_modules/vitest/vitest.mjs run --root ../.. packages/adapters/src/host-computer.test.ts apps/desktop/src/host-computer.test.ts
        env:
          ELECTRON_RUN_AS_NODE: "1"
          electron_config_cache: ${{ runner.temp }}/electron-cache
  web:
    name: Web E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ["1", "2", "3", "4", "5", "6", page-browser, pages, www]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakazo
        ports: ["5432:5432"]
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/rakazo
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"
      - name: Install Chromium and rendering fonts
        run: |
          pnpm --filter @rakazo/web exec playwright install chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install agent-browser
        if: env.SUITE == 'page-browser'
        timeout-minutes: 2
        run: |
          infra/sandboxes/computer/install-agent-browser.sh "$RUNNER_TEMP/agent-browser"
          echo "RAKAZO_AGENT_BROWSER=$RUNNER_TEMP/agent-browser/agent-browser" >> "$GITHUB_ENV"
      - name: Run all E2E specs, including nightly and heavy cases
        shell: bash
        run: |
          set -euo pipefail
          case "$SUITE" in
            www) pnpm --filter @rakazo/www e2e ;;
            page-browser) E2E_WORKERS=1 pnpm test:e2e -- --spec=page-browser.spec.ts ;;
            pages) E2E_WORKERS=2 pnpm test:e2e -- --spec=pages.spec.ts ;;
            *) E2E_SKIP_HEAVY=1 pnpm test:e2e -- --shard="$SUITE/6" ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-e2e-${{ matrix.suite }}
          path: |
            apps/web/test-results
            apps/web/blob-report
            apps/www/test-results
            playwright-report-www
          if-no-files-found: ignore
  compose:
    name: Compose smoke and Postgres upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: bash infra/compose/run-smokes.sh
      - run: bash infra/compose/upgrade-postgres.docker-test.sh
  full-validation:
    name: Full validation passed
    if: always()
    needs: [static, unit, integration, build, native, web, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required suite passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
